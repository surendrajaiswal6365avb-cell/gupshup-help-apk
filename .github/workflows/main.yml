name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: myapp
      - name: Clone builder
        run: git clone https://github.com/jipok/website-to-apk.git builder
      - name: Copy your config
        run: |
          cp myapp/config.toml builder/config.toml
          cp myapp/offline.html builder/offline.html || echo "no offline"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        working-directory: builder
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GupShup-Help-APK
          path: builder/app/build/outputs/apk/debug/*.apk
